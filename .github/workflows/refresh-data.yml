name: Refresh snapshot

# Every 30 minutes: pull a fresh snapshot from Roblox's public APIs, validate
# it, then record it in the Neon database. The site reads from Neon, so
# nothing is committed back to the repository. Each runner gets a fresh public
# IP, so per-IP rate-limit lockouts (the failure mode we hit locally) do not
# apply here. validate-snapshot gates the write: broken data fails the run
# instead of reaching the database.

on:
  schedule:
    # GitHub Actions cron is best-effort; expect a few minutes of jitter.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# If a previous run is still going, let it finish but don't queue more than one
# pending run on top of it.
concurrency:
  group: refresh-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refresh snapshot
        run: pnpm refresh-data

      - name: Validate snapshot
        run: pnpm validate-snapshot

      - name: Record in database
        run: pnpm db:ingest
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
